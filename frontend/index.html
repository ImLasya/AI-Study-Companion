<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMind — Intelligent Learning Workspace</title>
    <meta
      name="description"
      content="EduMind — Intelligent Learning Workspace. Turn learning into mastery. Learn with AI, practice what matters, and track your progress every step of the way."
    />
    <meta name="application-name" content="EduMind" />
    <meta property="og:title" content="EduMind — Intelligent Learning Workspace" />
    <meta property="og:description" content="Turn learning into mastery. Learn with AI, practice what matters, and track your progress every step of the way." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ai_study_companion_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
